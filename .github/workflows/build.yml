name: release-build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build (macos-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          # Apple Silicon
          - goarch: arm64
            runner: macos-14
          # # Intel macOS
          # - goarch: amd64
          #   runner: macos-14-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Build
        run: |
          scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ktt_macos_${{ matrix.goarch }}.release
          path: 'dist/*'
          retention-days: 1

  build-linux:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: debian12
            image: 'debian:12'
            platform: 'amd64'

          - name: debian12
            image: 'debian:12'
            platform: 'arm64'

          - name: debian13
            image: 'debian:13'
            platform: 'amd64'

          - name: debian13
            image: 'debian:13'
            platform: 'arm64'

          - name: ubuntu22
            image: 'ubuntu:22.04'
            platform: 'amd64'

          - name: ubuntu22
            image: 'ubuntu:22.04'
            platform: 'arm64'

          - name: rhel10
            image: 'redhat/ubi10:latest'
            platform: 'amd64'

          - name: rhel10
            image: 'redhat/ubi10:latest'
            platform: 'arm64'

          - name: rhel9
            image: 'redhat/ubi9:latest'
            platform: 'amd64'

          - name: rhel9
            image: 'redhat/ubi9:latest'
            platform: 'arm64'

          - name: rhel8
            image: 'redhat/ubi8:latest'
            platform: 'amd64'

          - name: rhel8
            image: 'redhat/ubi8:latest'
            platform: 'arm64'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries via Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/package/Dockerfile.buildapp 
          platforms: linux/${{ matrix.platform }}
          outputs: type=local,dest=./dist
          provenance: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ktt_linux_${{ matrix.name }}_${{ matrix.platform }}.release
          path: 'dist/*'
          retention-days: 1

  release:
    needs:
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*.release'
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
